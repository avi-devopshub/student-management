apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: 
  name: student-hpa 
  labels: 
    app: student 
spec: 
  scaleTargetRef: 
    apiVersion: apps/v1 
    kind: Deployment 
    name: student-deployment 
  minReplicas: 2
  maxReplicas: 4
  metrics: 
  - type: Resource 
    resource: 
      name: cpu
      target: 
        type: Utilization
        averageUtilization: 50
